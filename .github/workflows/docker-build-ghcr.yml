name: Build Docker image and push to GHCR

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Repository in owner/repo format"
        type: string
        required: true
        default: elconcept/ai-homelab-engine
      context_dir:
        description: "Build context relative to the source repository"
        type: string
        required: true
        default: examples/hello
      image_name:
        description: "GHCR image name (under elconcept)"
        type: string
        required: true
        default: ai-homelab-smoke
      tag:
        description: "Container tag"
        type: string
        required: true
        default: latest

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate inputs
        id: params
        shell: bash
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
          CONTEXT_DIR: ${{ inputs.context_dir }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REPO" =~ ^elconcept/[A-Za-z0-9_.-]+$ ]] || { echo "Source must be under elconcept"; exit 2; }
          [[ "$IMAGE_NAME" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || exit 2
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || exit 2
          echo "image=ghcr.io/elconcept/$IMAGE_NAME:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout build source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          path: source
          token: ${{ secrets.HOMELAB_GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Validate build context
        id: context
        shell: bash
        env:
          CONTEXT_DIR: ${{ inputs.context_dir }}
        run: |
          set -euo pipefail
          base="$(realpath -m "$GITHUB_WORKSPACE/source")"
          target="$(realpath -m "$base/$CONTEXT_DIR")"
          [[ "$target" == "$base" || "$target" == "$base/"* ]] || exit 2
          [[ -f "$target/Dockerfile" ]] || { echo "Dockerfile missing"; exit 2; }
          echo "path=$target" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.context.outputs.path }}
          file: ${{ steps.context.outputs.path }}/Dockerfile
          push: true
          tags: ${{ steps.params.outputs.image }}
          provenance: false
